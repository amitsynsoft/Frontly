<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="scheduler-favicon-title"
  style="color: var(--scheduler-logo-primary, var(--primary, #2563eb));"
>
  <title id="scheduler-favicon-title">Schedular System favicon</title>
  <style>
    .scheduler-favicon-line {
      fill: none;
      stroke: var(--scheduler-logo-surface, var(--primary-foreground, #ffffff));
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .scheduler-favicon-fill {
      fill: var(--scheduler-logo-surface, var(--primary-foreground, #ffffff));
    }
  </style>
  <rect width="64" height="64" rx="17" fill="currentColor" />
  <path
    class="scheduler-favicon-line"
    d="M28.5 32 49 15"
    stroke-width="5.2"
  />
  <path
    class="scheduler-favicon-line"
    d="M28.5 32 49.3 49.2"
    stroke-width="5.2"
  />
  <path
    class="scheduler-favicon-line"
    d="M24 27.7 17.8 22.5"
    stroke-width="4.3"
  />
  <path
    class="scheduler-favicon-line"
    d="M24 36.3 17.8 41.5"
    stroke-width="4.3"
  />
  <circle
    cx="17.4"
    cy="20.4"
    r="7.3"
    fill="none"
    stroke="var(--scheduler-logo-surface, var(--primary-foreground, #ffffff))"
    stroke-width="4.3"
  />
  <circle
    cx="17.4"
    cy="43.6"
    r="7.3"
    fill="none"
    stroke="var(--scheduler-logo-surface, var(--primary-foreground, #ffffff))"
    stroke-width="4.3"
  />
  <circle class="scheduler-favicon-fill" cx="28.6" cy="32" r="3.9" />
</svg>
